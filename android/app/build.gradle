apply plugin: 'com.android.application'

android {
    namespace = "com.bhumiamartya.app"
    compileSdk 36
    defaultConfig {
        applicationId "com.bhumiamartya.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 80
        versionName "4.4.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def keystoreFile = System.getenv('BHUMI_RELEASE_STORE_FILE')
    def keystorePassword = System.getenv('BHUMI_RELEASE_STORE_PASSWORD')
    def keyAlias = System.getenv('BHUMI_RELEASE_KEY_ALIAS')
    def keyPassword = System.getenv('BHUMI_RELEASE_KEY_PASSWORD')

    if (!keystoreFile || !keystorePassword || !keyAlias || !keyPassword) {
        def props = new Properties()
        def propFile = rootProject.file('keystore.properties')
        if (propFile.exists()) {
            propFile.withInputStream { props.load(it) }
        }
        keystoreFile = keystoreFile ?: props.getProperty('BHUMI_RELEASE_STORE_FILE')
        keystorePassword = keystorePassword ?: props.getProperty('BHUMI_RELEASE_STORE_PASSWORD')
        keyAlias = keyAlias ?: props.getProperty('BHUMI_RELEASE_KEY_ALIAS')
        keyPassword = keyPassword ?: props.getProperty('BHUMI_RELEASE_KEY_PASSWORD')
    }

    def releaseSigningComplete = keystoreFile && keystorePassword && keyAlias && keyPassword

    signingConfigs {
        release {
            if (releaseSigningComplete) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation "com.android.billingclient:billing:9.1.0"
    implementation "com.google.android.play:review:2.0.2"
    implementation "com.google.android.play:review-ktx:2.0.2"
    implementation "com.google.android.play:app-update:2.1.0"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


