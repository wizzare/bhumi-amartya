apply plugin: 'com.android.application'

android {
    namespace = "com.bhumiamartya.app"
    compileSdk 36
    defaultConfig {
        applicationId "com.bhumiamartya.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 118
        versionName "5.0.18"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def releaseStoreFile = System.getenv('BHUMI_RELEASE_STORE_FILE')
    def releaseStorePassword = System.getenv('BHUMI_RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('BHUMI_RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('BHUMI_RELEASE_KEY_PASSWORD')

    if (!releaseStoreFile || !releaseStorePassword || !releaseKeyAlias || !releaseKeyPassword) {
        def props = new Properties()
        def propFile = rootProject.file('keystore.properties')
        if (propFile.exists()) {
            propFile.withInputStream { props.load(it) }
        }
        releaseStoreFile = releaseStoreFile ?: props.getProperty('BHUMI_RELEASE_STORE_FILE')
        releaseStorePassword = releaseStorePassword ?: props.getProperty('BHUMI_RELEASE_STORE_PASSWORD')
        releaseKeyAlias = releaseKeyAlias ?: props.getProperty('BHUMI_RELEASE_KEY_ALIAS')
        releaseKeyPassword = releaseKeyPassword ?: props.getProperty('BHUMI_RELEASE_KEY_PASSWORD')
    }

    def releaseSigningComplete = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    def qaStoreFile = System.getenv('BHUMI_QA_STORE_FILE')
    def qaStorePassword = System.getenv('BHUMI_QA_STORE_PASSWORD')
    def qaKeyAlias = System.getenv('BHUMI_QA_KEY_ALIAS')
    def qaKeyPassword = System.getenv('BHUMI_QA_KEY_PASSWORD')

    if (!qaStoreFile || !qaStorePassword || !qaKeyAlias || !qaKeyPassword) {
        def qaProps = new Properties()
        def qaPropsPath = System.getenv('BHUMI_QA_KEYSTORE_PROPERTIES')
        def qaPropFile = qaPropsPath
            ? new File(qaPropsPath)
            : new File(System.getProperty('user.home'), '.bhumi-qa/signing/keystore.properties')
        if (qaPropFile.exists()) {
            qaPropFile.withInputStream { qaProps.load(it) }
        }
        qaStoreFile = qaStoreFile ?: qaProps.getProperty('BHUMI_QA_STORE_FILE')
        qaStorePassword = qaStorePassword ?: qaProps.getProperty('BHUMI_QA_STORE_PASSWORD')
        qaKeyAlias = qaKeyAlias ?: qaProps.getProperty('BHUMI_QA_KEY_ALIAS')
        qaKeyPassword = qaKeyPassword ?: qaProps.getProperty('BHUMI_QA_KEY_PASSWORD')
    }

    def qaSigningComplete = qaStoreFile && qaStorePassword && qaKeyAlias && qaKeyPassword

    signingConfigs {
        release {
            if (releaseSigningComplete) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
        qa {
            if (qaSigningComplete) {
                storeFile = file(qaStoreFile)
                storePassword = qaStorePassword
                keyAlias = qaKeyAlias
                keyPassword = qaKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa"
            if (qaSigningComplete) {
                signingConfig signingConfigs.qa
            }
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        if (qaSigningComplete) {
            qa {
                applicationIdSuffix ".qa"
                versionNameSuffix "-qa"
                signingConfig signingConfigs.qa
                minifyEnabled true
                shrinkResources true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                matchingFallbacks = ['release']
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation "com.android.billingclient:billing:9.1.0"
    implementation "com.google.android.play:review:2.0.2"
    implementation "com.google.android.play:review-ktx:2.0.2"
    implementation "com.google.android.play:app-update:2.1.0"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def rootServicesJSON = file('google-services.json')
    def qaServicesJSON = file('src/qa/google-services.json')
    def debugServicesJSON = file('src/debug/google-services.json')
    if (rootServicesJSON.exists() || qaServicesJSON.exists() || debugServicesJSON.exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
