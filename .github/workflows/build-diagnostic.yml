name: Build Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install > install.log 2>&1
      - name: Typecheck
        run: npx tsc --noEmit > typecheck.log 2>&1 || true
      - name: Build
        run: npm run build > build.log 2>&1 || true
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostic-logs
          path: |
            install.log
            typecheck.log
            build.log
          if-no-files-found: error
