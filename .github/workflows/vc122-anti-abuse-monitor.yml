name: VC122 Continuous Anti-Abuse Health Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-billing-verifier-and-anti-abuse:
    name: Production Verifier Health, CORS & Auth Fail-Closed Monitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run zero-PII production verifier & anti-abuse health check
        env:
          BHUMI_VERIFIER_CRON_SECRET: ${{ secrets.BHUMI_VERIFIER_CRON_SECRET }}
        run: node scripts/monitor-vc122-anti-abuse.mjs
